name: PROJECT EDGE v4 - Comparación histórica (SIN OPERAR)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-out-of-sample:
    name: Bloque anterior ${{ matrix.years_ago }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # v4 fue diseñada con referencias de los bloques 0, 1 y 2.
        # Los bloques 3 y 4 quedan fuera de muestra y no ajustan parametros.
        years_ago:
          - 3
          - 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comparar v3 ETH, v4 ETH y v4 BTC+ETH
        env:
          PYTHONPATH: ${{ github.workspace }}
          PROJECT_EDGE_MODE: PAPER
        run: >-
          python run_v4_comparison.py
          --days 365
          --years-ago "${{ matrix.years_ago }}"
          --output-dir "artifacts/v4-comparison-${{ matrix.years_ago }}"

      - name: Guardar comparacion descargable
        uses: actions/upload-artifact@v4
        with:
          name: project-edge-v4-comparison-365-days-${{ matrix.years_ago }}-years-ago
          path: artifacts/v4-comparison-${{ matrix.years_ago }}/
          if-no-files-found: error
          retention-days: 30
