name: PROJECT EDGE v3.1 - Diagnóstico histórico ETH

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Días históricos a evaluar"
        required: true
        default: "90"
        type: choice
        options:
          - "30"
          - "60"
          - "90"
          - "180"
          - "365"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar diagnóstico ETH v3.1
        env:
          PYTHONPATH: ${{ github.workspace }}
          PROJECT_EDGE_MODE: PAPER
        run: python run_historical_backtest.py --days "${{ inputs.days }}"

      - name: Guardar reporte descargable
        uses: actions/upload-artifact@v4
        with:
          name: project-edge-v3.1-diagnostic-eth-${{ inputs.days }}-days
          path: artifacts/backtest/
          if-no-files-found: error
          retention-days: 30
