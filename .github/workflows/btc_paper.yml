name: PROJECT EDGE - BTC Paper Trading

on:
  on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: project-edge-btc-paper
  cancel-in-progress: false

jobs:
  btc-paper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BTC paper trading
        run: python run_btc_paper.py

      - name: Persist paper trading state
        run: |
          if [ ! -f paper_state.json ]; then
            echo "No paper_state.json was created."
            echo "Nothing to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_state.json

          if git diff --cached --quiet; then
            echo "Paper state unchanged."
            exit 0
          fi

          git commit -m "Update paper trading state"
          git pull --rebase origin main
          git push origin HEAD:main
