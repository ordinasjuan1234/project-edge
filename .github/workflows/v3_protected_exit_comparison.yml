name: PROJECT EDGE v3 - Salida protegida (SIN OPERAR)

on:
  pull_request:
    branches:
      - main
    paths:
      - "engine/execution/v3_protected_exit_backtest.py"
      - "run_v3_protected_exit_comparison.py"
      - "tests/test_v3_protected_exit_backtest.py"
      - ".github/workflows/v3_protected_exit_comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Comparar bloque ${{ matrix.years_ago }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        years_ago:
          - 0
          - 1
          - 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar suite completa
        env:
          PROJECT_EDGE_MODE: PAPER
        run: pytest -q

      - name: Comparar v3 actual y salida protegida
        env:
          PYTHONPATH: ${{ github.workspace }}
          PROJECT_EDGE_MODE: PAPER
        run: >-
          python run_v3_protected_exit_comparison.py
          --days 365
          --years-ago "${{ matrix.years_ago }}"
          --output-dir "artifacts/v3-protected-exit-${{ matrix.years_ago }}"

      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: project-edge-v3-protected-exit-365-days-${{ matrix.years_ago }}-years-ago
          path: artifacts/v3-protected-exit-${{ matrix.years_ago }}/
          if-no-files-found: error
          retention-days: 30
