name: V6 Scalp Historical Comparison

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      days:
        description: Dias a evaluar
        required: true
        default: '365'
      years_ago:
        description: Bloque historico para v6
        required: true
        default: '2'

env:
  PROJECT_EDGE_MODE: PAPER

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar tests
        run: pytest -q
      - name: Ejecutar comparador v6 scalp
        run: |
          python run_v6_comparison.py \
            --days "${{ github.event.inputs.days || '365' }}" \
            --years-ago "${{ github.event.inputs.years_ago || '2' }}" \
            --output-dir artifacts/v6-comparison
      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: project-edge-v6-comparison-${{ github.event.inputs.days || '365' }}-days-${{ github.event.inputs.years_ago || '2' }}-years-ago
          path: artifacts/v6-comparison/
