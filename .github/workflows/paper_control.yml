name: PROJECT EDGE - Manual PAPER Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Accion PAPER"
        required: true
        type: choice
        options:
          - LONG
          - SHORT
          - CLOSE

permissions:
  contents: write

concurrency:
  group: project-edge-btc-paper
  cancel-in-progress: false

jobs:
  paper-control:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute manual PAPER action
        run: python manual_paper_control.py --action "${{ inputs.action }}"

      - name: Build live dashboard data
        run: python build_live_dashboard.py

      - name: Persist PAPER state and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_state.json dashboard_data.json

          if git diff --cached --quiet; then
            echo "No changes to persist."
            exit 0
          fi

          git commit -m "Manual PAPER action: ${{ inputs.action }}"
          git pull --rebase origin main
          git push origin HEAD:main
