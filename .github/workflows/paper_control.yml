name: PROJECT EDGE - Manual PAPER Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción PAPER"
        required: true
        type: choice
        options:
          - LONG
          - SHORT
          - CLOSE

      symbol:
        description: "Activo"
        required: true
        default: "BTCUSDT"
        type: choice
        options:
          - BTCUSDT
          - ETHUSDT

      capital:
        description: "Capital en USDT"
        required: false
        default: ""
        type: string

      leverage:
        description: "Apalancamiento PAPER"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

      stop_loss:
        description: "Stop Loss personalizado"
        required: false
        default: ""
        type: string

      take_profit:
        description: "Take Profit personalizado"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: project-edge-btc-paper
  cancel-in-progress: false

jobs:
  paper-control:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute manual PAPER action
        env:
          ACTION: ${{ inputs.action }}
          SYMBOL: ${{ inputs.symbol }}
          CAPITAL: ${{ inputs.capital }}
          LEVERAGE: ${{ inputs.leverage }}
          STOP_LOSS: ${{ inputs.stop_loss }}
          TAKE_PROFIT: ${{ inputs.take_profit }}
        run: |
          ARGS=(
            --action "$ACTION"
            --symbol "$SYMBOL"
            --leverage "$LEVERAGE"
          )

          if [ -n "$CAPITAL" ]; then
            ARGS+=(--capital "$CAPITAL")
          fi

          if [ -n "$STOP_LOSS" ]; then
            ARGS+=(--stop-loss "$STOP_LOSS")
          fi

          if [ -n "$TAKE_PROFIT" ]; then
            ARGS+=(--take-profit "$TAKE_PROFIT")
          fi

          python manual_paper_control.py "${ARGS[@]}"

      - name: Build live dashboard data
        run: python build_live_dashboard.py

      - name: Persist PAPER state and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_state.json dashboard_data.json

          if git diff --cached --quiet; then
            echo "No changes to persist."
            exit 0
          fi

          git commit -m "Manual PAPER action: ${{ inputs.action }}"
          git pull --rebase origin main
          git push origin HEAD:main
