name: PROJECT EDGE - Paper Persistence Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-edge-paper-persistence-test
  cancel-in-progress: false

jobs:
  persistence-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run persistence test
        run: python run_paper_persistence_test.py

      - name: Persist test state
        run: |
          if [ ! -f paper_state_persistence_test.json ]; then
            echo "Test state file was not created."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add paper_state_persistence_test.json

          if git diff --cached --quiet; then
            echo "Test state unchanged."
            exit 0
          fi

          git commit -m "Update paper persistence test state"
          git pull --rebase origin main
          git push origin HEAD:main
