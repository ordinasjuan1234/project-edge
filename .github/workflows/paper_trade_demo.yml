name: PROJECT EDGE - Validación completa PAPER

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validar sintaxis del bot
        run: |
          python -m py_compile run_btc_paper.py
          python -m py_compile paper_state.py
          python -m py_compile paper_trader.py
          python -m py_compile telegram_notifier.py

      - name: Ejecutar tests automáticos
        run: python -m pytest -q

      - name: Probar persistencia PAPER
        run: python run_paper_persistence_test.py

      - name: Probar operación PAPER
        run: python run_paper_trade_test.py
